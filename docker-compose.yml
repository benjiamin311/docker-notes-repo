# ---------------------------------------------------------------------------
#  docker-notes 部署文件（简单版）
#
#  先把 IMAGE 换成你的镜像地址，例如 ghcr.io/benjiamin311/docker-notes-repo:latest
#  1) cp .env.example .env 并改 IMAGE / COMPOSE_DIR
#  2) docker compose up -d
#  3) 浏览器打开 http://<NAS-IP>:8080
# ---------------------------------------------------------------------------
services:
  docker-notes:
    image: ${IMAGE:-ghcr.io/benjiamin311/docker-notes-repo:latest}
    container_name: docker-notes
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8080}:8080"
    environment:
      REFRESH_SECONDS: ${REFRESH_SECONDS:-300}
      TZ: ${TZ:-Asia/Shanghai}
      BASIC_AUTH: ${BASIC_AUTH:-}
      # 宿主机 compose 目录 -> 容器内挂载点，用于读取 x-note（项目级中文备注）
      PATH_MAP: ${PATH_MAP:-/opt:/mnt/host-compose}
      # 界面里改的备注存这里（挂 volume，重建容器不丢）
      NOTES_FILE: /data/notes.json
      # 1 = 允许在界面启停 / 执行命令；必须同时设置 BASIC_AUTH
      ALLOW_ACTIONS: ${ALLOW_ACTIONS:-0}
      ALLOW_EXEC: ${ALLOW_EXEC:-0}
    volumes:
      # 只读挂载 docker socket（注意：socket 权限等价于 root，详见 README「安全」）
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # compose 文件所在目录（只读），用于读取项目级 x-note
      - ${COMPOSE_DIR:-/opt}:${COMPOSE_MOUNT:-/mnt/host-compose}:ro
      # 界面备注
      - notes:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  notes:
